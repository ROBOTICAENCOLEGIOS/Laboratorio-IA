    <style>
      .splash-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .splash-screen[hidden] {
        display: none;
      }
      .splash-screen[data-theme="dark"] {
        background-color: #333;
        color: white;
      }
      .splash-screen > * {
        max-width: 80%;
      }
      .splash-spinner:after {
        content: " ";
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 6px solid;
        border-color: currentColor transparent currentColor transparent;
        animation: splash-spinner 1.2s linear infinite;
      }
      @keyframes splash-spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .splash-error-title {
        font-weight: bold;
      }
      .splash-error-title a {
        color: inherit;
      }
      .splash-errors {
        font-family: monospace;
      }
      .splash-error-list {
        white-space: pre-wrap;
      }
      .splash-reset {
        color: inherit;
        background: none;
        padding: 0;
        margin: 0;
        border: none;
        text-decoration: underline;
        cursor: pointer;
      }
      .splash-reset:disabled {
        opacity: 0.8;
      }
    </style>

    <noscript>
      <div class="splash-screen">
        <div>
          <h1>Laboratorio REC requires JavaScript</h1>
          <p>Consider using <a href="https://desktop.turbowarp.org/">TurboWarp Desktop</a> if you are afraid of remote JavaScript.</p>
        </div>
      </div>
      <p>Laboratorio REC es un entorno de programación en bloques basado en Scratch. Diseñado para que docentes y alumnos puedan animar objetos en pantalla usando IA en vivo (control por gestos, voz y señales de tránsito) o controlar nuestro robot educativo Auto Jeep vía Bluetooth.</p>

    <div class="splash-screen spash-waiting-for-js" hidden>
      <div class="splash-spinner"></div>

      <div class="splash-error-title" hidden>Something went wrong. <a href="https://scratch.mit.edu/users/GarboMuffin/#comments" target="_blank" rel="noreferrer">Please report</a> with the information below.</div>
      <div class="splash-errors" hidden></div>
      <button class="splash-reset" hidden>Click here to reset caches (can fix some errors)</button>
    </div>

    <script>
      (function () {
        'use strict';

        var theme = '';
        var accent = '#ff4c4c';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            if (parsed.accent === 'purple') {
              accent = '#855cd6';
            } else if (parsed.accent === 'blue') {
              accent = '#4c97ff';
            }
            if (parsed.gui === 'dark' || parsed.gui === 'light') {
              theme = parsed.gui;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var splash = document.querySelector('.spash-waiting-for-js');
        splash.setAttribute('data-theme', theme);
        if (theme !== 'dark') {
          
            splash.style.backgroundColor = accent;
            splash.style.color = 'white';
          
        }
        splash.hidden = false;

        var splashErrorTitle = document.querySelector('.splash-error-title');
        var splashError = document.querySelector('.splash-errors');
        var splashReset = document.querySelector('.splash-reset');

        var totalErrors = 0;
        window.onerror = function (event, source, line, col, err) {
          if (++totalErrors > 5) return; // dont bother logging more
          splashErrorTitle.hidden = splashError.hidden = splashReset.hidden = false;
          var el = document.createElement('div');
          el.textContent = 'Error (splash) in ' + source + ' (' + line + ':' + col + '): ' + err;
          splashError.appendChild(el);
        };

        splashReset.onclick = function () {
          splashReset.disabled = true;
          function hardRefresh() {
            var search = location.search.replace(/[?&]nocache=[\d.]+(?=$|&)/, '');
            // This is a functional cookie used so that we respond with Clear-Site-Data just once. No tracking.
            // Can't use nocache parameter to trigger this because people might accidentally bookmark that, and
            // then we would be clearing their cache on every visit.
            document.cookie = 'tw_clear_cache_once=1; max-age=60; path=/; samesite=strict; secure';
            location.replace(location.pathname + search + (search ? '&' : '?') + 'nocache=' + Math.floor(Math.random() * 10000000));
          }
          if ('serviceWorker' in navigator) {
            setTimeout(hardRefresh, 5000);
            navigator.serviceWorker.getRegistration("")
              .then(function(registration) {
                if (registration) {
                  return registration.unregister();
                }
              })
              .then(hardRefresh)
              .catch(hardRefresh);
          } else {
            hardRefresh();
          }
        };

        window.SplashEnd = () => {
          splash.hidden = true;
          window.onerror = null;
        };
      })();
    </script>

  <script>
    /* ════════════════════════════════════════════════════════════════════════
       REC Extension Loader — Archivos locales (misma repo)
       Las extensiones viven en /extensionesrec/ dentro de Laboratorio-IA.
       Se sirven directamente desde GitHub Pages sin pasar por jsDelivr,
       eliminando el caché CDN externo y permitiendo cambios inmediatos.
       ════════════════════════════════════════════════════════════════════════ */
    (async function recLocalLoader() {
      const BASE = new URL('extensionesrec/', document.baseURI).href;

      const EXTENSIONS = [
        'extensionpcb.js',
        'extensionAutonoma.js',
        'iamanos.js',
        'iaemociones.js',
        'senialestransito.js',
        'iaobjetos.js',
        'iateachable.js',
        'vozatexto.js',
      ];

      // Construir URLs locales con cache-busting
      const bust = Date.now();
      window.REC_EXTENSION_URLS = EXTENSIONS.map(f => BASE + f + '?t=' + bust);
      console.info('[REC Loader] Cargando extensiones locales desde:', BASE);

      // ── Esperar al VM de TurboWarp ──────────────────────────────────────
      const vm = await new Promise((resolve, reject) => {
        if (window.vm) return resolve(window.vm);
        const TIMEOUT_MS = 20000;
        const t0 = Date.now();
        const id = setInterval(() => {
          if (window.vm) { clearInterval(id); resolve(window.vm); }
          else if (Date.now() - t0 > TIMEOUT_MS) { clearInterval(id); reject(new Error('TurboWarp VM no disponible tras ' + TIMEOUT_MS / 1000 + 's')); }
        }, 250);
      }).catch(e => { console.warn('[REC Loader]', e.message); return null; });

      if (!vm) return;

      // ── Cargar extensiones en orden ─────────────────────────────────────
      for (const url of window.REC_EXTENSION_URLS) {
        try {
          await vm.extensionManager.loadExtensionURL(url);
          console.info('[REC Loader] ✅', url);
        } catch (e) {
          console.warn('[REC Loader] ⚠️ Error cargando', url, '—', e.message);
        }
      }
    })();
  </script>

  <script>
    /* ════════════════════════════════════════════════════════════════════
       REC — Botón "ROBOT JEEP VIRTUAL" en el menu bar
       Estrategia dual:
       1. CSS inyectado oculta "Ver página del proyecto" por href — inmune
          a re-renders de React (el browser aplica CSS siempre).
       2. MutationObserver persistente re-inyecta el botón rojo cada vez
          que React destruye y recrea el DOM del menu bar.
       ════════════════════════════════════════════════════════════════════ */
    (function recJeepShortcut() {
      'use strict';
      const JEEP_URL = new URL('extensionesrec/robotjeepvirtual.js', document.baseURI).href;

      // ── 1. CSS: ocultar "Ver página del proyecto" de forma permanente ────────
      // Targets: el propio <a> Y su wrapper hoverable (evita espacio vacío).
      // Ambos selectores de href cubren producción y desarrollo local.
      (function injectHideCSS() {
        if (document.getElementById('rec-hide-pagina-css')) return;
        const s = document.createElement('style');
        s.id = 'rec-hide-pagina-css';
        s.textContent =
          /* ocultar el <a> home en toda la barra */
          '[class*="menu-bar_"] a[href*="laboratoriorec.com.ar"],' +
          '[class*="menu-bar_"] a[href*="Laboratorio-IA"]' +
          '{display:none!important}' +
          /* ocultar el wrapper hoverable que LO CONTIENE (elimina el hueco) */
          '[class*="menu-bar_hoverable"]:has(a[href*="laboratoriorec.com.ar"]),' +
          '[class*="menu-bar_hoverable"]:has(a[href*="Laboratorio-IA"])' +
          '{display:none!important}';
        document.head.appendChild(s);
      })();

      // ── 2. Toast de confirmación ─────────────────────────────────────────────
      function showRecToast(title, message, type) {
        const existing = document.getElementById('rec-toast');
        if (existing) existing.remove();
        const color = type === 'success' ? '#22a06b' : '#e81b23';
        const icon = type === 'success'
          ? '<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="11" fill="' + color + '"/><polyline points="5,11 9,15 17,7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : '<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="11" fill="' + color + '"/><line x1="7" y1="7" x2="15" y2="15" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="15" y1="7" x2="7" y2="15" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
        const toast = document.createElement('div');
        toast.id = 'rec-toast';
        toast.innerHTML = icon +
          '<div style="flex:1"><strong style="display:block;margin-bottom:3px">' + title + '</strong>' +
          '<span style="font-size:0.8rem;line-height:1.3">' + message + '</span></div>' +
          '<button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:#666;font-size:1.1rem;line-height:1;padding:0 0 0 8px;align-self:flex-start">\u00D7</button>';
        toast.style.cssText =
          'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99999;' +
          'display:flex;align-items:flex-start;gap:10px;' +
          'background:#fff;color:#222;font-family:inherit;font-size:0.875rem;' +
          'padding:20px 24px;border-radius:10px;max-width:380px;width:90%;' +
          'box-shadow:0 8px 32px rgba(0,0,0,0.28);animation:recToastIn 0.3s ease;';
        if (!document.getElementById('rec-toast-style')) {
          const ts = document.createElement('style');
          ts.id = 'rec-toast-style';
          ts.textContent =
            '@keyframes recToastIn{from{opacity:0;transform:translate(-50%,-44%)}to{opacity:1;transform:translate(-50%,-50%)}}' +
            '@keyframes recToastOut{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-46%)}}';
          document.head.appendChild(ts);
        }
        document.body.appendChild(toast);
        setTimeout(function () {
          if (toast.parentElement) {
            toast.style.animation = 'recToastOut 0.3s ease forwards';
            setTimeout(function () { toast.remove(); }, 300);
          }
        }, 5000);
      }

      // ── 3. Búsqueda robusta por texto visible ────────────────────────────────
      // Recorre buttons, links y divs hoverable buscando "ver página" en su texto.
      // Usa getBoundingClientRect para confirmar que está en la barra superior.
      function findByText(needle) {
        var lower = needle.toLowerCase();
        var tags = 'button,a,[role="button"],[tabindex="0"]';
        var els = document.querySelectorAll(tags);
        return Array.from(els).find(function (el) {
          if (el.id === 'rec-jeep-shortcut') return false;
          if (!el.textContent.trim().toLowerCase().includes(lower)) return false;
          try {
            var r = el.getBoundingClientRect();
            return r.width > 0 && r.top >= 0 && r.top < 80;
          } catch (e) { return false; }
        });
      }

      // ── 4. Inyección resistente a re-renders de React ────────────────────────
      var _grayBtn = null; // referencia guardada para re-ocultar tras re-render

      function tryInject() {
        console.log('[REC-DEBUG] Buscando botón por texto...');

        // Si React re-renderizó y el botón gris volvió a ser visible, volver a ocultarlo
        if (_grayBtn && _grayBtn.style.display !== 'none') {
          _grayBtn.style.display = 'none';
          console.log('[REC-DEBUG] Botón gris re-ocultado tras re-render de React.');
        }

        // Si nuestro botón rojo sigue en el DOM, nada más que hacer
        if (document.getElementById('rec-jeep-shortcut')) return;

        var grayBtn = findByText('ver p\u00E1gina'); // "ver página"
        if (!grayBtn) {
          console.log('[REC-DEBUG] Botón "Ver página" no encontrado en este ciclo.');
          return;
        }

        console.log('[REC-DEBUG] \u00A1Bot\u00F3n original encontrado!', grayBtn.textContent.trim(), grayBtn);
        _grayBtn = grayBtn;
        grayBtn.style.display = 'none';

        var parent = grayBtn.parentElement;
        if (!parent) {
          console.warn('[REC-DEBUG] El botón gris no tiene padre. Abortando.');
          return;
        }

        // Crear botón rojo
        var btn = document.createElement('button');
        btn.id = 'rec-jeep-shortcut';
        btn.textContent = 'ROBOT JEEP VIRTUAL';
        btn.title = 'Cargar extensión Robot Jeep Virtual';
        btn.style.cssText =
          'background:#e81b23;color:#fff;font-weight:bold;font-family:inherit;' +
          'font-size:0.75rem;padding:0 0.75rem;height:2rem;border:none;' +
          'border-radius:4px;cursor:pointer;margin:0 8px;white-space:nowrap;' +
          'align-self:center;flex-shrink:0;transition:background 0.15s;';
        btn.onmouseenter = function () { btn.style.background = '#b31219'; };
        btn.onmouseleave = function () { btn.style.background = '#e81b23'; };
        btn.onclick = function () {
          if (!window.vm || !window.vm.extensionManager) {
            console.warn('[REC] VM no disponible todavía.');
            return;
          }
          window.vm.extensionManager.loadExtensionURL(JEEP_URL + '?t=' + Date.now())
            .then(function () {
              console.info('[REC] \u2705 Robot Jeep Virtual cargado');
              showRecToast(
                '\u00A1Jeep Virtual Listo!',
                'La extensi\u00F3n se carg\u00F3 correctamente. Ve abajo de todo en la paleta de bloques para encontrar las funciones del ROBOT JEEP VIRTUAL.',
                'success'
              );
            })
            .catch(function (e) {
              console.warn('[REC] \u26A0\uFE0F', e.message);
              showRecToast(
                'Jeep ya cargado',
                'La extensi\u00F3n Robot Jeep Virtual ya estaba activa en este proyecto.',
                'error'
              );
            });
        };

        // Insertar en la MISMA posición que ocupaba el botón gris
        parent.insertBefore(btn, grayBtn);
        console.log('[REC-DEBUG] \u00A1Bot\u00F3n rojo inyectado con \u00E9xito!', btn);
      }

      // Observer PERSISTENTE — sobrevive a re-renders de React
      console.log('[REC-DEBUG] Iniciando observador de men\u00FA...');
      new MutationObserver(function () { tryInject(); })
        .observe(document.body, { childList: true, subtree: true });

      // Intento inicial (por si el menú ya estaba en el DOM)
      tryInject();
    })();
  </script>
